name: Build ALI Android APK & Deploy Live App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ali-ci-cd"
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ALI Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ALI-Advanced-Learning-Interface.apk

      - name: Upload ALI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALI-Advanced-Learning-Interface-APK
          path: app/build/outputs/apk/debug/ALI-Advanced-Learning-Interface.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ali
          name: "ALI -• Advanced Learning Interface (Android APK)"
          body: |
            ### ALI -• Advanced Learning Interface (Native Android APK)
            - **100% Free & Unlimited On-Device AI Companion**
            - **Hybrid Offline Brain**: Autonomous Cognitive Engine + On-Device GGUF (`llama.cpp` JNI)
            - **Zero-Data-Leak Private Online Curiosity Engine**: Strips all personal context before researching public encyclopedic topics
            - **Day-to-Day Mobile Actions**: Voice conversation, Alarms, Timers, Tasks, Notes, SMS drafts, Calendar & System Assistant
          files: app/build/outputs/apk/debug/ALI-Advanced-Learning-Interface.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-live-simulator:
    name: Deploy Live Mobile Web Preview (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ALI Source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Simulator Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'simulator'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
